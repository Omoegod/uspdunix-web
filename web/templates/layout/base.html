{{define "base"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{.Title}}</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f7fb; color: #1f2937; }
    header { background: #111827; color: #fff; padding: 12px 20px; }
    main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 16px; }
    .muted { color: #6b7280; }
    .actions a, .actions button { margin-right: 8px; }
  </style>
</head>
<body>
  <header>USPD Web Configurator</header>
  <main>
    {{template "content" .}}
  </main>
</body>
</html>
{{end}}
