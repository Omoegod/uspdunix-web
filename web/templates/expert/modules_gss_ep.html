{{define "expert_modules_gss_ep"}}
{{template "expert_page_start" .}}

<div class="card gssep-page">
  <div class="rf-conf-head">
    <p class="page-lead"><a href="/expert/modules">← Обзор модулей</a></p>
    <h3>УСПД в протоколе GSS</h3>
    <div class="rf-conf-toolbar">
      {{if not .DeviceBacked}}
      <button type="button" class="btn-secondary" id="gssepAddBtn" onclick="gssepAdd()">Добавить</button>
      <button type="button" class="btn-secondary" id="gssepDelBtn" onclick="gssepDelete()" disabled>Удалить</button>
      {{end}}
      <span id="gssepStatus" class="muted"></span>
    </div>
  </div>

  <div class="sys-layout">
    <section class="rf-conf-section">
      <div class="rf-conf-section-title">Модули</div>
      <div class="hw-table-wrap">
        <table class="hw-table gssep-table" id="gssepTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Исходящий интерфейс</th>
              <th>Группа</th>
            </tr>
          </thead>
          <tbody id="gssepTableBody">
            <tr><td colspan="3" class="muted">Загрузка…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="rf-conf-section" id="gssepFormSection">
      <div class="rf-conf-section-title">Настройка модуля</div>
      <form id="gssepForm" class="sys-form" onsubmit="return gssepSave(event)">
        <input type="hidden" id="gssepIdx" value="0" />
        <div class="rf-cfgnode-fields gssep-fields">
          <div class="rf-conf-field gssep-field-wide">
            <label>Локальный сервер (вход)</label>
            <input id="gssepLocalInput" type="text" readonly />
          </div>
          <div class="rf-conf-field gssep-field-wide">
            <label>Исходящий интерфейс</label>
            <select id="gssepLocalOutput"></select>
          </div>
          <div class="rf-conf-field gssep-field-wide">
            <label>Группа устройств</label>
            <select id="gssepEpGroup"></select>
          </div>
        </div>
        <div class="sys-actions">
          <button type="submit" class="btn-primary" id="gssepSaveBtn" disabled>Сохранить</button>
        </div>
      </form>
    </section>
  </div>
</div>

<script id="gssepItemsJson" type="application/json">{{.GssEpsJSON}}</script>
<script id="gssepTransfersJson" type="application/json">{{.TransferIfacesJSON}}</script>
<script id="gssepGroupsJson" type="application/json">{{.EpGroupsJSON}}</script>
<script>
(function () {
  function parseJson(id) {
    try {
      const el = document.getElementById(id);
      let parsed = JSON.parse((el && el.textContent) || '[]');
      if (typeof parsed === 'string') parsed = JSON.parse(parsed);
      return parsed;
    } catch (e) {
      return [];
    }
  }

  const defaults = {
    local_server_input: '',
    local_server_output: '',
    ep_group_idx: 0
  };

  let items = parseJson('gssepItemsJson');
  let transfers = parseJson('gssepTransfersJson');
  let groups = parseJson('gssepGroupsJson');
  let selected = items.length ? 0 : -1;

  function setStatus(msg, ok) {
    const el = document.getElementById('gssepStatus');
    if (!el) return;
    el.textContent = msg || '';
    el.className = ok === true ? 'status ok' : (ok === false ? 'status err' : 'muted');
  }

  function transferLabel(serverOutput) {
    for (let i = 0; i < transfers.length; i++) {
      if (transfers[i].server_output === serverOutput) return transfers[i].label;
    }
    return serverOutput || '—';
  }

  function groupLabel(idx) {
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].index === idx) {
        return 'Группа #' + idx + ' (' + groups[i].count + ' устр.)';
      }
    }
    return 'Группа #' + idx;
  }

  function ensureTransferOption(serverOutput) {
    if (!serverOutput) return;
    for (let i = 0; i < transfers.length; i++) {
      if (transfers[i].server_output === serverOutput) return;
    }
    transfers.push({ kind: 'custom', label: 'Текущее: ' + serverOutput, server_output: serverOutput });
  }

  function ensureGroupOption(idx) {
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].index === idx) return;
    }
    groups.push({ index: idx, count: 0 });
  }

  function fillTransferSelect(current) {
    const sel = document.getElementById('gssepLocalOutput');
    if (!sel) return;
    ensureTransferOption(current);
    sel.innerHTML = '';
    transfers.forEach(function (t) {
      const opt = document.createElement('option');
      opt.value = t.server_output;
      opt.textContent = t.label;
      sel.appendChild(opt);
    });
    if (current) sel.value = current;
  }

  function fillGroupSelect(current) {
    const sel = document.getElementById('gssepEpGroup');
    if (!sel) return;
    ensureGroupOption(current);
    groups.sort(function (a, b) { return a.index - b.index; });
    sel.innerHTML = '';
    groups.forEach(function (g) {
      const opt = document.createElement('option');
      opt.value = String(g.index);
      opt.textContent = groupLabel(g.index);
      sel.appendChild(opt);
    });
    sel.value = String(current);
  }

  function setFormEnabled(on) {
    document.getElementById('gssepSaveBtn').disabled = !on;
    const delBtn = document.getElementById('gssepDelBtn');
    if (delBtn) delBtn.disabled = !on;
  }

  function renderTable() {
    const tbody = document.getElementById('gssepTableBody');
    if (!tbody) return;
    if (!items.length) {
      tbody.innerHTML = '<tr><td colspan="3" class="muted">Нет модулей</td></tr>';
      setFormEnabled(false);
      return;
    }
    tbody.innerHTML = items.map(function (m, i) {
      const sel = i === selected ? ' is-selected' : '';
      return (
        '<tr class="hw-row gssep-row' + sel + '" data-idx="' + i + '">' +
        '<td>' + i + '</td>' +
        '<td class="gssep-out">' + transferLabel(m.local_server_output) + '</td>' +
        '<td>' + groupLabel(Number(m.ep_group_idx) || 0) + '</td>' +
        '</tr>'
      );
    }).join('');
    tbody.querySelectorAll('.gssep-row').forEach(function (row) {
      row.onclick = function () {
        gssepSelect(Number(row.dataset.idx));
      };
    });
  }

  function fillForm(idx) {
    const m = items[idx];
    if (!m) return;
    document.getElementById('gssepIdx').value = String(idx);
    document.getElementById('gssepLocalInput').value = m.local_server_input || '';
    fillTransferSelect(m.local_server_output || '');
    fillGroupSelect(Number(m.ep_group_idx) || 0);
    setFormEnabled(true);
  }

  function readForm() {
    return {
      local_server_input: document.getElementById('gssepLocalInput').value || '',
      local_server_output: document.getElementById('gssepLocalOutput').value,
      ep_group_idx: Number(document.getElementById('gssepEpGroup').value) || 0
    };
  }

  window.gssepSelect = function (idx) {
    if (idx < 0 || idx >= items.length) return;
    selected = idx;
    document.querySelectorAll('.gssep-row').forEach(function (row) {
      row.classList.toggle('is-selected', Number(row.dataset.idx) === idx);
    });
    fillForm(idx);
    setStatus('Выбран модуль #' + idx);
  };

  window.gssepSave = function (ev) {
    ev.preventDefault();
    const idx = Number(document.getElementById('gssepIdx').value);
    const body = readForm();
    if (!body.local_server_output) {
      setStatus('Выберите исходящий интерфейс', false);
      return false;
    }
    setStatus('Сохранение…');
    fetch('/api/modules/uspd-gss-ep?idx=' + idx, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().then(function (data) {
        if (!r.ok) throw new Error((data && data.error) || r.statusText);
        return data;
      });
    }).then(function () {
      items[idx] = body;
      renderTable();
      gssepSelect(idx);
      setStatus('Сохранено', true);
    }).catch(function (err) {
      setStatus(err.message, false);
    });
    return false;
  };

  window.gssepAdd = function () {
    const body = Object.assign({}, defaults);
    if (transfers.length) {
      body.local_server_output = transfers[0].server_output;
    }
    if (groups.length) {
      body.ep_group_idx = groups[0].index != null ? groups[0].index : 0;
    }
    if (!body.local_server_output) {
      setStatus('Нет доступных исходящих интерфейсов', false);
      return;
    }
    setStatus('Добавление…');
    fetch('/api/modules/uspd-gss-ep', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().then(function (data) {
        if (!r.ok) throw new Error((data && data.error) || r.statusText);
        return data;
      });
    }).then(function () {
      return reloadAll().then(function () {
        if (items.length) gssepSelect(items.length - 1);
        setStatus('Добавлено', true);
      });
    }).catch(function (err) {
      setStatus(err.message, false);
    });
  };

  window.gssepDelete = function () {
    if (selected < 0 || selected >= items.length) return;
    if (!confirm('Удалить модуль #' + selected + '?')) return;
    const idx = selected;
    setStatus('Удаление…');
    fetch('/api/modules/uspd-gss-ep?idx=' + idx, { method: 'DELETE' })
      .then(function (r) {
        return r.json().then(function (data) {
          if (!r.ok) throw new Error((data && data.error) || r.statusText);
          return data;
        });
      })
      .then(function () {
        return reloadAll().then(function () {
          setStatus('Удалено', true);
        });
      })
      .catch(function (err) {
        setStatus(err.message, false);
      });
  };

  function reloadAll() {
    setStatus('Загрузка…');
    return Promise.all([
      fetch('/api/modules/uspd-gss-ep').then(function (r) { return r.json(); }),
      fetch('/api/modules/uspd-gss-ep?transfers=1').then(function (r) { return r.json(); }),
      fetch('/api/endpoint-groups').then(function (r) { return r.json(); })
    ]).then(function (results) {
      items = (results[0] && results[0].items) || [];
      transfers = (results[1] && results[1].items) || transfers || [];
      groups = (results[2] && results[2].items) || groups || [];
      items.forEach(function (m) {
        ensureTransferOption(m.local_server_output);
        ensureGroupOption(Number(m.ep_group_idx) || 0);
      });
      selected = items.length ? Math.min(Math.max(selected, 0), items.length - 1) : -1;
      renderTable();
      if (selected >= 0) gssepSelect(selected);
      else {
        setFormEnabled(false);
        document.getElementById('gssepForm').reset();
        document.getElementById('gssepLocalInput').value = '';
      }
      setStatus('Модулей: ' + items.length, true);
    }).catch(function (err) {
      setStatus(err.message, false);
      renderTable();
    });
  }

  const urlIdx = new URLSearchParams(window.location.search).get('idx');
  if (items.length) {
    items.forEach(function (m) {
      ensureTransferOption(m.local_server_output);
      ensureGroupOption(Number(m.ep_group_idx) || 0);
    });
    renderTable();
    const startIdx = urlIdx !== null ? Number(urlIdx) : 0;
    if (Number.isFinite(startIdx) && startIdx >= 0 && startIdx < items.length) {
      gssepSelect(startIdx);
    } else {
      gssepSelect(0);
    }
    setStatus('Модулей: ' + items.length);
  } else {
    reloadAll();
  }
})();
</script>

{{template "expert_page_end" .}}
{{end}}
